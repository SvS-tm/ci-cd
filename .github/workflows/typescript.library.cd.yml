on:
    workflow_call:
        secrets:
            NPM_REGISTRIES_CONFIG:
                required: true
jobs:
  publish_release:
    if: ${{  github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
      packages: write
    steps:

    - name: checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: setup pnpm and runtimes
      uses: pnpm/setup@v3
      with:
        install: false

    - name: download latest artifact
      uses: svs-tm/ci-cd/.github/actions/download-latest-artifact@main
      with:
        owner: ${{ github.repository_owner }}
        repository: ${{ github.event.repository.name }}
        token: ${{ github.token }}
        artifact_name: ${{ github.event.pull_request.id }}
        path: ${{ github.workspace }}

    - name: create release
      id: create_release
      uses: svs-tm/ci-cd/.github/actions/create-npm-packages-release@main
      with:
        token: ${{ github.token }}
        owner: ${{ github.repository_owner }}
        repository: ${{ github.event.repository.name }}
        path: ${{ github.workspace }}
        target_commitish: ${{ github.event.pull_request.merge_commit_sha }}

    - name: publish packages
      if: ${{ steps.create_release.outputs.id }}
      uses: svs-tm/ci-cd/.github/actions/publish-npm-packages@main
      with:
        paths: ${{ steps.create_release.outputs.packages }}
      env:
        NPM_REGISTRIES_CONFIG: ${{ secrets.NPM_REGISTRIES_CONFIG }}
